name: CI

# Até 10/08/2026 a suíte só rodava dentro do pipeline de release (deploy.yml,
# disparado por tag v*). Um erro só aparecia no meio de um release já em
# andamento. Este workflow roda o mesmo gate em PR e em push na main.
on:
  push:
    branches: [main]
  pull_request:

# Um push novo na mesma branch/PR cancela o run anterior: aqui não há deploy,
# só verificação — o resultado antigo não interessa mais.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # package, não test: `mvnw test` roda com o Quinoa desabilitado ("Quinoa is
      # disabled by default in tests"), então a suíte sozinha nunca instala o Node
      # nem roda o vite. Só o package exercita o build do frontend, que é o que o
      # deploy faz. Custa ~13s a mais (medido a frio, com .quinoa/ vazio).
      - name: Full test suite + frontend build
        working-directory: swapi-app
        run: ./mvnw package
