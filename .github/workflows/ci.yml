name: CI

# Até 10/08/2026 a suíte só rodava dentro do pipeline de release (deploy.yml,
# disparado por tag v*). Um erro só aparecia no meio de um release já em
# andamento. Este workflow roda o mesmo gate em PR e em push na main.
on:
  push:
    branches: [main]
  pull_request:

# Um push novo na mesma branch/PR cancela o run anterior: aqui não há deploy,
# só verificação — o resultado antigo não interessa mais.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # package, não test: `mvnw test` roda com o Quinoa desabilitado ("Quinoa is
      # disabled by default in tests"), então a suíte sozinha nunca instala o Node
      # nem roda o vite. Só o package exercita o build do frontend, que é o que o
      # deploy faz. Custa ~13s a mais (medido a frio, com .quinoa/ vazio).
      - name: Full test suite + frontend build
        working-directory: swapi-app
        run: ./mvnw package

      # Maven never runs Vitest: Quinoa's `vite build` bundles the frontend, it
      # does not test it. Without this step the frontend suite — including the
      # "no raw colour" guard in tokens.test.ts — passes locally and gates
      # nothing. The Node version is read from application.properties instead of
      # pinned here, so the toolchain keeps a single source of truth.
      - name: Resolve the pinned Node version
        id: node
        run: |
          version=$(sed -n 's/^quarkus\.quinoa\.package-manager-install\.node-version=//p' \
            swapi-app/src/main/resources/application.properties)
          test -n "$version" || { echo "node-version not found in application.properties"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: swapi-app/src/main/webui/package-lock.json
      - name: Frontend tests
        working-directory: swapi-app/src/main/webui
        run: |
          npm ci
          npm test
