name: CI

# Until 2026-08-10 the suite only ran inside the release pipeline (then
# deploy.yml, triggered by a v* tag). An error only surfaced in the middle of a
# release already in flight. This workflow runs the same gate on PRs and pushes
# to main; the release pipeline (native-binary.yml) runs it again on the tag,
# and only there: on a pull request its test job is skipped, so this workflow
# is the one run of the suite and must keep its pull_request trigger unfiltered.
on:
  push:
    branches: [main]
  pull_request:

# Verification only: the job reads the repository and writes nothing.
permissions:
  contents: read

# A new push on the same branch/PR cancels the previous run: there is no deploy
# here, only verification — the old result no longer matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # package, not test: `mvnw test` runs with Quinoa disabled ("Quinoa is
      # disabled by default in tests"), so the suite alone never installs Node
      # nor runs vite. Only package exercises the frontend build, which is what
      # the deploy does. Costs ~13s extra (measured cold, with .quinoa/ empty).
      - name: Full test suite + frontend build
        working-directory: swapi-app
        run: ./mvnw package

      # Release scripts live outside Maven and Vitest, so they get their own
      # plain-bash tests. Throwaway keys only; the runner's OpenSSL 3 is enough.
      - name: Release script tests
        run: scripts/registry-key.test.sh

      # The forced command of the host's deploy user: valid requests pass,
      # injection and malformed tags or hashes are refused. Runs without the host.
      - name: Deploy gate tests
        run: scripts/swapi-deploy-gate.test.sh

      # Which jobs of native-binary.yml run for a release, a dispatch, a
      # redeploy and a pull request, decided from the job conditions: a pull
      # request runs the suite once (here), and a red suite on a release never
      # builds or deploys.
      - name: Release pipeline trigger tests
        run: scripts/native-binary-triggers.test.sh

      # swapi-update lives only as a code block in docs/DEPLOY.md (section 2.5).
      # The test extracts it and runs it against a temporary directory: an
      # upgrade keeps two versions, and a redeploy of the active version must
      # not remove the rollback copy. Runs without the host or the network.
      - name: Host update script tests
        run: scripts/swapi-update.test.sh

      # Every action from outside this repository is pinned by a full commit
      # SHA with its release in a comment; a tag or a branch fails here. How to
      # move a pin: docs/DEPLOY.md, "Moving the pin of an action".
      - name: Actions pinned by commit
        run: scripts/pinned-actions.test.sh

      # The repo is still connected to the old Vercel project; without
      # git.deploymentEnabled false every push starts a Vercel deployment.
      - name: Vercel git deployments stay off
        run: scripts/vercel-git-off.test.sh

      # The deploy probes www.swapi.build with `verify-deploy.sh redirect`; fake
      # www and apex hosts on 127.0.0.1 prove a correct 308 passes and a wrong
      # status, host or dropped query fails, and (2.11.0+) that following the www
      # to /docs/mcp gives text without JavaScript. Runs without the network.
      - name: Redirect probe tests
        run: scripts/verify-deploy-redirect.test.sh

      # The extraction of the server-drawn <main> (2.11.0+) used by the content
      # probes and the Native smoke: an empty one-line <main> must give no text.
      - name: Main text extraction tests
        run: scripts/main-text.test.sh

      # Nothing outside the application build is left orphan: every helper
      # script is named by a document in docs/ or by a workflow, and every
      # Maven project under examples/ is in the matrix of examples.yml, which
      # compiles it. Reads the repository only.
      - name: No unreferenced script or example
        run: scripts/unreferenced.test.sh

      # The FAQ's monitor count (docs/RELEASE.md, step 4): GitHub cuts a list of
      # runs at 1000 results, so the count reads the history in windows. A fake
      # gh with a cap of 5 proves a longer history is counted whole, and that a
      # cut list or a total that does not add up prints no count. Offline.
      - name: Uptime run count tests
        run: scripts/uptime-run-count.test.sh

      # Maven never runs Vitest: Quinoa's `vite build` bundles the frontend, it
      # does not test it. Without this step the frontend suite — including the
      # "no raw colour" guard in tokens.test.ts — passes locally and gates
      # nothing. The Node version is read from application.properties instead of
      # pinned here, so the toolchain keeps a single source of truth.
      - name: Resolve the pinned Node version
        id: node
        run: |
          version=$(sed -n 's/^quarkus\.quinoa\.package-manager-install\.node-version=//p' \
            swapi-app/src/main/resources/application.properties)
          test -n "$version" || { echo "node-version not found in application.properties"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: swapi-app/src/main/webui/package-lock.json
      - name: Frontend tests
        working-directory: swapi-app/src/main/webui
        run: |
          npm ci
          npm test

      # ESLint, the type-check and Prettier in check mode, over the whole
      # package: the sources, the config files and the .cjs scripts. One package
      # script, so a local `npm run check` is exactly what this step runs. It
      # reuses the Node version and the `npm ci` of the step above.
      - name: Frontend lint, types and formatting
        working-directory: swapi-app/src/main/webui
        run: npm run check
