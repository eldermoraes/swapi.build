name: Deploy

# Deploy is triggered by a release tag (v*) or manually — never by a commit
# push (git.deploymentEnabled: false on Vercel still holds).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# An explicit shell: bash is load-bearing: only then does Actions invoke bash
# with -o pipefail, and a failed probe on the left of "| tee" fails the job.
# The default shell (bash -e) does NOT have pipefail.
defaults:
  run:
    shell: bash

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # package, not test: with `mvnw test` Quinoa stays disabled ("Quinoa is
      # disabled by default in tests") and the gate passed green without ever
      # installing Node or running vite — a broken toolchain only surfaced in the
      # preview job, with the release already in flight. NodeToolchainTest covers
      # the coherence between node-version and the lockfile; this step covers the
      # real build.
      - name: Full test suite + frontend build
        working-directory: swapi-app
        run: ./mvnw package

  preview:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy preview (from swapi-app/, never the repo root)
        id: deploy
        working-directory: swapi-app
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          set +e
          URL=$(npx vercel deploy --token "$VERCEL_API_TOKEN" --scope algorium --yes 2>vercel-err.log)
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            # The CLI sometimes loses the log stream; the remote build keeps
            # going (docs/DEPLOY.md, Troubleshooting). Poll until it leaves BUILDING.
            cat vercel-err.log
            DPL=$(curl -s "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=1" \
              -H "Authorization: Bearer $VERCEL_API_TOKEN" | python3 -c 'import json,sys; d=json.load(sys.stdin)["deployments"][0]; print(d["uid"])')
            echo "CLI dropped; following deployment $DPL via the API"
            for i in $(seq 1 90); do
              STATE=$(curl -s "https://api.vercel.com/v13/deployments/$DPL?teamId=$VERCEL_ORG_ID" \
                -H "Authorization: Bearer $VERCEL_API_TOKEN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["readyState"])')
              echo "readyState: $STATE"
              case "$STATE" in
                READY) break ;;
                ERROR|CANCELED) echo "deploy failed: $STATE"; exit 1 ;;
                *) sleep 20 ;;
              esac
            done
            [ "$STATE" = "READY" ] || { echo "timeout waiting for READY"; exit 1; }
            URL=https://$(curl -s "https://api.vercel.com/v13/deployments/$DPL?teamId=$VERCEL_ORG_ID" \
              -H "Authorization: Bearer $VERCEL_API_TOKEN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])')
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify preview (runbook probes, incl. stateful burst)
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: ./scripts/verify-deploy.sh preview "${{ steps.deploy.outputs.url }}" | tee -a "$GITHUB_STEP_SUMMARY"

  production:
    needs: preview
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Deploy production (from swapi-app/)
        working-directory: swapi-app
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: npx vercel deploy --prod --token "$VERCEL_API_TOKEN" --scope algorium --yes
      - name: Verify production (runbook probes, no burst)
        run: ./scripts/verify-deploy.sh prod swapi.build | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Manual step reminder
        run: |
          echo '**Remaining manual step:** open https://swapi.build in a browser and confirm the pageview in the Analytics dashboard (script served != collection working).' >> "$GITHUB_STEP_SUMMARY"
