name: Native binary and deploy

# The release pipeline (docs/DEPLOY.md, "Automated deploy"): full test suite →
# linux/amd64 native executable attached, with its SHA-256, to the GitHub
# Release → manual approval (environment `production`) → install on the
# self-hosted origin over SSH → production probes on both names.
#
# - release: published, not the tag push: the Release is created by hand after
#   the tag (docs/RELEASE.md), so a tag trigger would race a Release that does
#   not exist yet.
# - workflow_dispatch: build and attach the binary to an existing Release that
#   has none yet (the upload never replaces an asset), then deploy it. With the
#   sha256 input, redeploy a Release that already has its binary: test and
#   build are skipped and the operator supplies the hash from the original
#   run's summary, so swapi-update still checks two sources.
# - pull_request touching this file, scripts/native-smoke.sh or
#   swapi-app/pom.xml (dependency changes, version bumps): runs the suite, the
#   build, the GLIBC check and the native smoke without uploading or deploying
#   anything, so a change to the pipeline, to the smoke or to what goes into
#   the native image is proven before merge.
#
# Why the deploy is a job here (needs: build) and not a workflow_run of its
# own: it gets the hash straight from the build job's output, in the same run,
# with no artifact download and no reading it back from the Release (which
# would turn the two-source check of swapi-update into a single source). A
# failed deploy is retried with "Re-run failed jobs", which reuses that output.
#
# The build runs inside the UBI9 Mandrel builder container
# (quarkus.native.builder-image, glibc 2.34). Building directly on the
# ubuntu-latest runner (glibc 2.39) would produce a binary that does not start
# on the Ubuntu 22.04 host (glibc 2.35). march=compatibility drops the default
# x86-64-v3 target (AVX2/BMI2/FMA), which the host CPU is not known to have.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, attach and deploy (e.g. v2.6.0)
        required: true
      sha256:
        description: >-
          Redeploy only. SHA-256 of the binary already attached to that Release,
          copied from the summary of its original run (the second source). When
          set, test and build are skipped and only the deploy job runs.
        required: false
        default: ''
  pull_request:
    paths:
      - .github/workflows/native-binary.yml
      - scripts/native-smoke.sh
      - swapi-app/pom.xml

permissions:
  contents: read

concurrency:
  group: native-binary-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

# bash with -o pipefail (only an explicit shell: bash gets it): a failed probe
# on the left of "| tee" fails the step.
defaults:
  run:
    shell: bash

env:
  # Never interpolated into a script directly: passed through the environment.
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  test:
    # Skipped on a redeploy (workflow_dispatch with sha256): the tag was
    # already tested and built when it was released.
    if: ${{ !inputs.sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate the tag
        if: github.event_name != 'pull_request'
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: '$TAG'"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || format('refs/tags/{0}', env.TAG) }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # package, not test: with `mvnw test` Quinoa stays disabled ("Quinoa is
      # disabled by default in tests") and the gate would pass green without
      # ever installing Node or running vite. NodeToolchainTest covers the
      # coherence between node-version and the lockfile; this step covers the
      # real build. The native build below runs with -DskipTests, so this job is
      # the suite that gates the release.
      - name: Full test suite + frontend build
        working-directory: swapi-app
        run: ./mvnw -B package

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.sha.outputs.sha256 }}
    env:
      # Highest glibc symbol version the host provides (Ubuntu 22.04).
      MAX_GLIBC: '2.35'
    steps:
      - name: Validate the tag
        if: github.event_name != 'pull_request'
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: '$TAG'"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || format('refs/tags/{0}', env.TAG) }}

      - name: The tag matches the pom version
        if: github.event_name != 'pull_request'
        working-directory: swapi-app
        run: |
          pom=$(sed -n 's|.*<version>\(.*\)</version>.*|\1|p' pom.xml | head -1)
          [ "v$pom" = "$TAG" ] || { echo "tag $TAG does not match pom version $pom"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Native build in the UBI9 builder container
        working-directory: swapi-app
        run: |
          ./mvnw -B package -Dnative \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.native-image-xmx=6g \
            -Dquarkus.native.march=compatibility \
            -DskipTests
          runners=(target/*-runner)
          [ "${#runners[@]}" -eq 1 ] && [ -f "${runners[0]}" ] || { echo "expected one *-runner, got: ${runners[*]}"; exit 1; }
          mkdir -p ../dist
          cp "${runners[0]}" ../dist/application
          file ../dist/application

      # Regression test for the glibc trap: fail if any GLIBC_ symbol version
      # required by the binary is newer than what the host provides.
      - name: GLIBC requirement is at most ${{ env.MAX_GLIBC }}
        working-directory: dist
        run: |
          versions=$(objdump -T application | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu)
          [ -n "$versions" ] || { echo "no GLIBC_ symbols found: is this a dynamically linked binary?"; exit 1; }
          highest=$(echo "$versions" | tail -1)
          echo "highest GLIBC_ required: $highest (max allowed: $MAX_GLIBC)"
          top=$(printf '%s\n%s\n' "$highest" "$MAX_GLIBC" | sort -V | tail -1)
          [ "$top" = "$MAX_GLIBC" ] || { echo "binary needs GLIBC_$highest > $MAX_GLIBC: it will not start on the host"; exit 1; }

      - name: SHA-256
        id: sha
        working-directory: dist
        run: |
          sha256sum application > application.sha256
          cat application.sha256
          echo "sha256=$(cut -d' ' -f1 application.sha256)" >> "$GITHUB_OUTPUT"
          {
            echo "### Native binary ${TAG:-(pull request build, not uploaded)}"
            echo
            echo "Second source for the checksum: the deploy job passes this value to swapi-update, which also checks \`application.sha256\` on the Release."
            echo
            echo '```'
            cat application.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 2.11.0+: nobody ran the binary before this, and swapi-update restarts the
      # host before it knows the new version answers (docs/DEPLOY.md). Started
      # here on the runner (glibc 2.39 >= the 2.35 it needs), it must serve
      # /api/people/1, /openapi.json and the four server-rendered pages
      # (scripts/native-smoke.sh). A failure stops the job: nothing is attached
      # and the deploy never begins. Runs on pull requests too, like the build.
      - name: Native smoke
        run: |
          PORT=8099 ./dist/application > "$RUNNER_TEMP/native-smoke.log" 2>&1 &
          app=$!
          status=0
          ./scripts/native-smoke.sh http://127.0.0.1:8099 | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          kill "$app" 2>/dev/null || true
          wait "$app" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "--- application log ---"
            tail -n 50 "$RUNNER_TEMP/native-smoke.log"
          fi
          exit "$status"

      - name: Attach to the Release
        if: github.event_name != 'pull_request'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        # No --clobber: an asset that already exists is never silently replaced.
        run: gh release upload "$TAG" application application.sha256 --repo "$GITHUB_REPOSITORY"

  deploy:
    needs: build
    # After a successful build, or on a redeploy (workflow_dispatch with
    # sha256), where test and build are skipped on purpose. A build skipped
    # because the suite failed never deploys: sha256 is empty then.
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' &&
      (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' && inputs.sha256 != '')) }}
    runs-on: ubuntu-latest
    # Manual approval: the job waits here until a reviewer of the environment
    # approves (in the Actions UI or through the REST API, docs/RELEASE.md).
    environment: production
    timeout-minutes: 20
    # One deploy at a time on the host, whatever the tag.
    concurrency:
      group: deploy-oracle
      cancel-in-progress: false
    env:
      SHA256: ${{ needs.build.outputs.sha256 || inputs.sha256 }}
      ORIGIN_IP: ${{ vars.SWAPI_ORIGIN_IP }}
    steps:
      - name: Validate the inputs
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: '$TAG'"; exit 1; }
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "no valid sha256 from the build job: '$SHA256'"; exit 1; }
          [[ "$ORIGIN_IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "vars.SWAPI_ORIGIN_IP is not an IPv4 address"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      # The host key is pinned by the ORACLE_KNOWN_HOSTS secret; an unknown or
      # changed key aborts the connection (StrictHostKeyChecking=yes).
      - name: SSH key and pinned host key
        env:
          DEPLOY_KEY: ${{ secrets.ORACLE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "secret ORACLE_DEPLOY_KEY is empty"; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo "secret ORACLE_KNOWN_HOSTS is empty"; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"

      # The host runs only the forced command swapi-deploy-gate, which accepts
      # exactly "update <tag> <sha256>" and calls sudo swapi-update. swapi-update
      # downloads the binary from the Release, checks the hash against the
      # Release's application.sha256 and against this value, switches
      # /opt/swapi/current, restarts swapi and fails if it does not answer.
      - name: Install on the host (swapi-update)
        run: |
          ssh -i "$RUNNER_TEMP/ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            "deploy@$ORIGIN_IP" "update $TAG $SHA256"

      - name: Remove the SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"

      - name: Verify production (swapi.build)
        run: ./scripts/verify-deploy.sh origin swapi.build | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify www redirect (www.swapi.build → swapi.build)
        run: ./scripts/verify-deploy.sh redirect www.swapi.build swapi.build | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Manual step reminder
        run: |
          echo "**Deployed $TAG.** Remaining: step 9 of docs/RELEASE.md and the MCP Registry publish (step 10)." >> "$GITHUB_STEP_SUMMARY"
