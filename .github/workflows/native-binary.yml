name: Native binary

# Builds the linux/amd64 native executable for the self-hosted origin
# (docs/DEPLOY.md, "Self-hosted origin on Oracle Cloud") and attaches it, with
# its SHA-256, to the GitHub Release.
#
# - release: published, not the tag push: the Release is created by hand after
#   the tag (docs/RELEASE.md), so a tag trigger would race a Release that does
#   not exist yet.
# - workflow_dispatch: re-attach the binary to an existing Release.
# - pull_request touching this file: builds and runs the GLIBC check without
#   uploading anything, so a change to the build is proven before merge.
#
# The build runs inside the same UBI9 Mandrel builder the Vercel image uses
# (quarkus.native.builder-image, glibc 2.34). Building directly on the
# ubuntu-latest runner (glibc 2.39) would produce a binary that does not start
# on the Ubuntu 22.04 host (glibc 2.35). march=compatibility drops the default
# x86-64-v3 target (AVX2/BMI2/FMA), which the host CPU is not known to have.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach (e.g. v2.6.0)
        required: true
  pull_request:
    paths:
      - .github/workflows/native-binary.yml

permissions:
  contents: read

concurrency:
  group: native-binary-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

# bash with -o pipefail (only an explicit shell: bash gets it).
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # Never interpolated into a script directly: passed through the environment.
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # Highest glibc symbol version the host provides (Ubuntu 22.04).
      MAX_GLIBC: '2.35'
    steps:
      - name: Validate the tag
        if: github.event_name != 'pull_request'
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: '$TAG'"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || format('refs/tags/{0}', env.TAG) }}

      - name: The tag matches the pom version
        if: github.event_name != 'pull_request'
        working-directory: swapi-app
        run: |
          pom=$(sed -n 's|.*<version>\(.*\)</version>.*|\1|p' pom.xml | head -1)
          [ "v$pom" = "$TAG" ] || { echo "tag $TAG does not match pom version $pom"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Native build in the UBI9 builder container
        working-directory: swapi-app
        run: |
          ./mvnw -B package -Dnative \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.native-image-xmx=6g \
            -Dquarkus.native.march=compatibility \
            -DskipTests
          runners=(target/*-runner)
          [ "${#runners[@]}" -eq 1 ] && [ -f "${runners[0]}" ] || { echo "expected one *-runner, got: ${runners[*]}"; exit 1; }
          mkdir -p ../dist
          cp "${runners[0]}" ../dist/application
          file ../dist/application

      # Regression test for the glibc trap: fail if any GLIBC_ symbol version
      # required by the binary is newer than what the host provides.
      - name: GLIBC requirement is at most ${{ env.MAX_GLIBC }}
        working-directory: dist
        run: |
          versions=$(objdump -T application | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu)
          [ -n "$versions" ] || { echo "no GLIBC_ symbols found: is this a dynamically linked binary?"; exit 1; }
          highest=$(echo "$versions" | tail -1)
          echo "highest GLIBC_ required: $highest (max allowed: $MAX_GLIBC)"
          top=$(printf '%s\n%s\n' "$highest" "$MAX_GLIBC" | sort -V | tail -1)
          [ "$top" = "$MAX_GLIBC" ] || { echo "binary needs GLIBC_$highest > $MAX_GLIBC: it will not start on the host"; exit 1; }

      - name: SHA-256
        working-directory: dist
        run: |
          sha256sum application > application.sha256
          cat application.sha256
          {
            echo "### Native binary ${TAG:-(pull request build, not uploaded)}"
            echo
            echo "Second source for the checksum: compare with \`application.sha256\` on the Release before installing."
            echo
            echo '```'
            cat application.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach to the Release
        if: github.event_name != 'pull_request'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        # No --clobber: an asset that already exists is never silently replaced.
        run: gh release upload "$TAG" application application.sha256 --repo "$GITHUB_REPOSITORY"
