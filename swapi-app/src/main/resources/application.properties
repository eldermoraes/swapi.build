quarkus.http.port=${PORT:5432}

quarkus.container-image.registry=docker.io
quarkus.container-image.group=eldermoraes
quarkus.container-image.name=swapi-app
quarkus.container-image.tag=2.1.0

quarkus.jib.platforms=linux/amd64
quarkus.jib.base-jvm-image=eclipse-temurin:25.0.3_9-jre-ubi10-minimal
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25
quarkus.native.container-runtime-options=--platform=linux/amd64
quarkus.native.resources.includes=data/*.json

quarkus.log.level=INFO

# MCP server (Streamable HTTP at /mcp). Both paradigms coexist on the same
# endpoint: a 2026-07-28 client is stateless per spec; an earlier client does
# an initialize and receives an Mcp-Session-Id.
#
# auto-init: an unknown or missing Mcp-Session-Id is served with a throwaway
# session instead of a 404 — it does not affect a genuine initialize, which
# still creates a real session in this instance's heap (default
# connection-idle-timeout of 30min). Without this the stateful client breaks in
# production, because the session lives in one instance's heap and Vercel has
# no session affinity. Fix recommended by the extension maintainer
# (quarkiverse/quarkus-mcp-server#876).
# Costs one discarded session per request without a valid session — irrelevant
# here, because the tools are pure read-only and use no session state at all.
# See docs/superpowers/specs/2026-08-03-mcp-dual-stateful-stateless-design.md
quarkus.mcp.server.http.streamable.auto-init=true

# Behind Vercel the Origin is never localhost -> the DNS rebinding check would return 403
quarkus.mcp.server.http.dns-rebinding-check.enabled=false
quarkus.mcp.server.server-info.name=swapi.build

# OpenAPI: the API's canonical contract, served at a friendly URL on the root.
# The site's /docs page renders from it (single source of documentation).
quarkus.smallrye-openapi.path=/openapi.json
quarkus.smallrye-openapi.info-title=swapi.build — Star Wars API
quarkus.smallrye-openapi.info-description=RESTful public API with data about the Star Wars universe. All successful GETs return 200; nonexistent ids return 404. The same data is also exposed as an MCP server (Streamable HTTP) at /mcp.
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0

# Behind the edge (Cloudflare/Vercel) TLS terminates at the border; the real
# host/scheme arrive via X-Forwarded-*. Required for public base URL discovery
# (REST via UriInfo, MCP via HttpServerRequest). Safe: in production the app
# is only reachable through the edge.
# Defense in depth suggested in issue #12: the ApiNotFoundMapper 404s echo the
# id segment verbatim in text/plain. Current browsers do not sniff text/plain
# into HTML, but if some error path ever returns a sniffable type, this header
# prevents the reinterpretation. Global on purpose: it applies to every
# response of the app, not only the 404s.
quarkus.http.header."X-Content-Type-Options".value=nosniff

quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true

# Vite assets carry a hash in the name -> immutable cache on the Vercel edge
quarkus.http.filter.assets.matches=/assets/.*
quarkus.http.filter.assets.header."Cache-Control"=public, max-age=31536000, immutable
# Vary here was verified against a real asset, in a native container (2026-08-03):
# GET /assets/<hash>.js with an Origin header returned, at the same time,
# Cache-Control: public, max-age=31536000, immutable + the echoed
# Access-Control-Allow-Origin + Vary: Origin. The filter really fires at the
# origin. In dev mode this was not observable, because Quinoa serves Vite and
# this filter never runs.
#
# Question that remains open, and that no local smoke test answers: these assets
# have max-age without s-maxage, and the Vary only matters if the Vercel edge
# uses s-maxage as the cache key for this response (see
# docs/superpowers/specs/2026-08-03-cache-borda-resiliencia-design.md). A local
# container does not exercise the edge - only a real deploy answers.
quarkus.http.filter.assets.header."Vary"=Origin

# SINGLE definition of the Cache-Control for edge-cacheable responses.
# The CacheControlFilter (JAX-RS, covers /api) injects this property with
# @ConfigProperty; the HTTP filter covering /openapi.json references it with
# ${swapi.cache-control.public}. Do not duplicate the value anywhere.
# The stale-while-revalidate is belt-and-braces: in practice it never fires,
# because it would only apply after the s-maxage expires and Vercel's cache key
# includes the deployment URL — a deploy invalidates the entry long before that.
swapi.cache-control.public=public, max-age=300, s-maxage=31536000, stale-while-revalidate=86400

# The OpenAPI spec only changes on deploy -> edge-cacheable like the API data.
# Route served by the smallrye-openapi extension, outside @ApplicationPath("/api"):
# it does not pass through a ContainerResponseFilter, so the header comes from
# the HTTP filter. References the SAME property the CacheControlFilter injects —
# do not duplicate the value.
quarkus.http.filter.openapi.matches=/openapi\\.json
quarkus.http.filter.openapi.header."Cache-Control"=${swapi.cache-control.public}
quarkus.http.filter.openapi.header."Vary"=Origin

# SINGLE definition of the Cache-Control for the SPA HTML. Deliberately NOT
# swapi.cache-control.public: that value has max-age=300, and the browser cache
# is not invalidated by a deploy — an index.html up to 5 minutes old would point
# at asset hashes the new deployment no longer serves. The HTML policy is the
# inverse: max-age=0 + must-revalidate (the browser ALWAYS revalidates) and a
# high s-maxage (the edge serves without waking the function; the edge cache
# key includes the deployment URL, so the next deploy invalidates the entry).
swapi.cache-control.html=public, max-age=0, must-revalidate, s-maxage=31536000

# The HTML of these routes is produced by SeoRoutes (injects the meta tags into
# index.html) and carries no Cache-Control of its own; without this filter the
# Vercel edge injects "public, max-age=0, must-revalidate" and every page view
# with a cold PoP executes the function (usage_anomaly of 2026-09-03: 6 parallel
# cold starts for 3 page views).
#
# Explicit, anchored list of the SPA routes (getRoute() in main.ts and
# PUBLIC_SEO_ROUTES in seo.ts) — NOT a catch-all with exclusions: a wrong
# negative regex would silently break either the /api cache or the /_vercel
# analytics collection. Unknown paths are unique (scanners), so caching them
# would buy nothing anyway. A new SPA route must be added here and to
# CacheHeadersTest.SPA_ROUTES; forgetting only costs the cache (visible as MISS).
# Verified in a @QuarkusTest on 2026-09-06: the filter writes the header exactly
# once, nothing downstream overrides or duplicates it.
quarkus.http.filter.spa.matches=/|/docs|/docs/mcp|/docs/webmcp|/about|/privacy|/terms|/resource/[^/]+|/resource/[^/]+/[^/]+
# Only GET/HEAD is cacheable. The filter runs before routing, so without this it
# would also stamp s-maxage on the response to a POST/PUT/DELETE against a SPA path.
quarkus.http.filter.spa.methods=GET,HEAD
quarkus.http.filter.spa.header."Cache-Control"=${swapi.cache-control.html}
quarkus.http.filter.spa.header."Vary"=Origin

# An MCP client running in a browser cannot connect without this (the extension
# warns at startup). The filter is global, so /api also starts accepting
# cross-origin — desired: the API is public, read-only, no auth, no cookies.
#
# WARNING: Quarkus ECHOES the request Origin in Access-Control-Allow-Origin (not
# a literal "*") and emits no Vary. Every edge-cacheable response needs
# Vary: Origin — see the CacheControlFilter and the openapi filter above.
# Without it the edge serves one origin's header to another, and the
# Origin-less variant to browser clients, which get blocked.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
# Without this a browser MCP client cannot read these headers from the
# initialize response (CORS hides response headers from JS by default).
quarkus.http.cors.exposed-headers=Mcp-Session-Id,Mcp-Protocol-Version

# Quinoa frontend
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.package-manager-install=true
# Node 22 LTS: vite 8 and eslint 10 require ^20.19.0 || >=22.12.0. Do not go
# below this floor without first downgrading both dependencies in package.json.
quarkus.quinoa.package-manager-install.node-version=22.23.2
