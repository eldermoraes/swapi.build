quarkus.http.port=${PORT:5432}

quarkus.container-image.registry=docker.io
quarkus.container-image.group=eldermoraes
quarkus.container-image.name=swapi-app
quarkus.container-image.tag=1.8.1

quarkus.jib.platforms=linux/amd64
quarkus.jib.base-jvm-image=eclipse-temurin:24.0.1_9-jre-ubi9-minimal
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-24
quarkus.native.container-runtime-options=--platform=linux/amd64
quarkus.native.resources.includes=data/*.json

quarkus.log.level=INFO

# Assets do Vite tem hash no nome -> cache imutavel na edge da Vercel
quarkus.http.filter.assets.matches=/assets/.*
quarkus.http.filter.assets.header."Cache-Control"=public, max-age=31536000, immutable

# Quinoa frontend
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=20.18.1
