quarkus.http.port=${PORT:5432}

quarkus.container-image.registry=docker.io
quarkus.container-image.group=eldermoraes
quarkus.container-image.name=swapi-app
quarkus.container-image.tag=1.9.1

quarkus.jib.platforms=linux/amd64
quarkus.jib.base-jvm-image=eclipse-temurin:25.0.3_9-jre-ubi10-minimal
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25
quarkus.native.container-runtime-options=--platform=linux/amd64
quarkus.native.resources.includes=data/*.json

quarkus.log.level=INFO

# MCP server (Streamable HTTP em /mcp; stateless auto-detectado pela extensao 2.x)
# Atras da Vercel o Origin nunca e localhost -> o check de DNS rebinding retornaria 403
quarkus.mcp.server.http.dns-rebinding-check.enabled=false
quarkus.mcp.server.server-info.name=swapi.build

# OpenAPI: contrato canonico da API, servido em URL amigavel na raiz.
# A pagina /docs do site renderiza a partir dele (fonte unica de documentacao).
quarkus.smallrye-openapi.path=/openapi.json
quarkus.smallrye-openapi.info-title=swapi.build — Star Wars API
quarkus.smallrye-openapi.info-description=RESTful public API with data about the Star Wars universe. All successful GETs return 200; nonexistent ids return 404. The same data is also exposed as an MCP server (Streamable HTTP) at /mcp.
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0

# Atras do edge (Cloudflare/Vercel) o TLS termina na borda; host/scheme reais
# chegam via X-Forwarded-*. Necessario para o discovery do base URL publico
# (REST via UriInfo, MCP via HttpServerRequest). Seguro: em producao a app
# so e alcancavel atraves do edge.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true

# Assets do Vite tem hash no nome -> cache imutavel na edge da Vercel
quarkus.http.filter.assets.matches=/assets/.*
quarkus.http.filter.assets.header."Cache-Control"=public, max-age=31536000, immutable

# Quinoa frontend
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=20.18.1
