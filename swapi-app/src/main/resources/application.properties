quarkus.http.port=${PORT:5432}

quarkus.container-image.registry=docker.io
quarkus.container-image.group=eldermoraes
quarkus.container-image.name=swapi-app
quarkus.container-image.tag=2.1.0

quarkus.jib.platforms=linux/amd64
quarkus.jib.base-jvm-image=eclipse-temurin:25.0.3_9-jre-ubi10-minimal
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25
quarkus.native.container-runtime-options=--platform=linux/amd64
quarkus.native.resources.includes=data/*.json

quarkus.log.level=INFO

# MCP server (Streamable HTTP em /mcp). Os dois paradigmas convivem no mesmo
# endpoint: cliente 2026-07-28 e stateless por spec; cliente anterior faz
# initialize e recebe um Mcp-Session-Id.
#
# auto-init: a sessao passa a ser descartavel por request, entao um
# Mcp-Session-Id emitido por OUTRA instancia e aceito em vez de 404. Sem isso o
# cliente stateful quebra em producao, porque a sessao vive na heap de uma
# instancia e o Vercel nao tem afinidade de sessao. Correcao recomendada pelo
# mantenedor da extensao (quarkiverse/quarkus-mcp-server#876). Custa uma sessao
# descartada por request — irrelevante aqui, porque as tools sao read-only puras
# e nao usam nada de estado de sessao.
# Ver docs/superpowers/specs/2026-08-03-mcp-dual-stateful-stateless-design.md
quarkus.mcp.server.http.streamable.auto-init=true

# Atras da Vercel o Origin nunca e localhost -> o check de DNS rebinding retornaria 403
quarkus.mcp.server.http.dns-rebinding-check.enabled=false
quarkus.mcp.server.server-info.name=swapi.build

# OpenAPI: contrato canonico da API, servido em URL amigavel na raiz.
# A pagina /docs do site renderiza a partir dele (fonte unica de documentacao).
quarkus.smallrye-openapi.path=/openapi.json
quarkus.smallrye-openapi.info-title=swapi.build — Star Wars API
quarkus.smallrye-openapi.info-description=RESTful public API with data about the Star Wars universe. All successful GETs return 200; nonexistent ids return 404. The same data is also exposed as an MCP server (Streamable HTTP) at /mcp.
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0

# Atras do edge (Cloudflare/Vercel) o TLS termina na borda; host/scheme reais
# chegam via X-Forwarded-*. Necessario para o discovery do base URL publico
# (REST via UriInfo, MCP via HttpServerRequest). Seguro: em producao a app
# so e alcancavel atraves do edge.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true

# Assets do Vite tem hash no nome -> cache imutavel na edge da Vercel
quarkus.http.filter.assets.matches=/assets/.*
quarkus.http.filter.assets.header."Cache-Control"=public, max-age=31536000, immutable
# Vary aqui e conservador, NAO verificado contra um asset real: em dev mode o
# Quinoa serve o Vite e este filtro nao dispara, entao nao foi possivel observar
# a resposta de um /assets/<hash>.js de verdade. Duvida aberta: estes assets tem
# max-age sem s-maxage, e a borda da Vercel cacheia com base no s-maxage (ver
# docs/superpowers/specs/2026-08-03-cache-borda-resiliencia-design.md), entao o
# Vary pode ser inerte aqui. Mantido porque o custo e um header e o risco de
# faltar e servir ACAO de um origin para outro. Conferir no smoke do container.
quarkus.http.filter.assets.header."Vary"=Origin

# Definicao UNICA do Cache-Control das respostas cacheaveis na borda.
# O CacheControlFilter (JAX-RS, cobre /api) injeta esta propriedade com
# @ConfigProperty; o filtro HTTP que cobre /openapi.json a referencia com
# ${swapi.cache-control.public}. Nao duplicar o valor em lugar nenhum.
# O stale-while-revalidate e belt-and-braces: na pratica nunca dispara, porque
# so valeria depois do s-maxage expirar e a chave de cache da Vercel inclui a
# deployment URL — o deploy invalida a entrada muito antes disso.
swapi.cache-control.public=public, max-age=300, s-maxage=31536000, stale-while-revalidate=86400

# A spec OpenAPI so muda em deploy -> cacheavel na borda como os dados da API.
# Rota servida pela extensao smallrye-openapi, fora do @ApplicationPath("/api"):
# nao passa por ContainerResponseFilter, entao o header vem do filtro HTTP.
# Referencia a MESMA propriedade que o CacheControlFilter injeta — nao duplicar o valor.
quarkus.http.filter.openapi.matches=/openapi\\.json
quarkus.http.filter.openapi.header."Cache-Control"=${swapi.cache-control.public}
quarkus.http.filter.openapi.header."Vary"=Origin

# Cliente MCP que roda em browser nao conecta sem isso (a extensao avisa no
# startup). O filtro e global, entao /api tambem passa a aceitar cross-origin —
# desejado: a API e publica, read-only, sem auth e sem cookies.
#
# ATENCAO: o Quarkus ECOA o Origin da request no Access-Control-Allow-Origin (nao
# um "*" literal) e nao emite Vary. Toda resposta cacheavel na borda precisa de
# Vary: Origin — ver o CacheControlFilter e o filtro openapi acima. Sem isso a
# borda serve o header de um origin para outro, e a variante sem Origin para
# clientes de browser, que ficam bloqueados.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

# Quinoa frontend
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=20.18.1
