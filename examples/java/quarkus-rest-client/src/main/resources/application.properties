# The remote API this example calls. The app runs on Quarkus' default port 8080.
quarkus.rest-client.swapi-api.url=https://swapi.build/api

# Without this, the client maps any 4xx/5xx to an exception even for methods
# returning Response; with it, the upstream status passes through untouched.
microprofile.rest.client.disable.default.mapper=true

# Point at a locally running swapi.build instead:
# quarkus.rest-client.swapi-api.url=http://localhost:5432/api
