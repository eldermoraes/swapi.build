# ---------------------------------------------------------------------------
# swapi.build assistant — example client
# ---------------------------------------------------------------------------
quarkus.http.port=8090
quarkus.http.test-port=8091

# --- Model: Ollama -----------------------------------------------------------
# A "-cloud" model runs on Ollama's hosted infrastructure: it needs `ollama
# signin` and network access. To run fully local, use any tool-calling model
# you have pulled, e.g. gpt-oss:20b or qwen3.5:35b.
quarkus.langchain4j.ollama.chat-model.model-name=gemma4:31b-cloud
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.timeout=120s

# --- MCP path: tools come from the remote swapi.build MCP server -------------
# This block is the entire MCP integration. There is no client code.
quarkus.langchain4j.mcp.swapi.transport-type=streamable-http
quarkus.langchain4j.mcp.swapi.url=https://swapi.build/mcp
# Point at a locally running swapi.build instead:
# quarkus.langchain4j.mcp.swapi.url=http://localhost:5432/mcp

# --- REST path: the same data over the public HTTP API -----------------------
quarkus.rest-client.swapi-api.url=https://swapi.build/api
# Point at a locally running swapi.build instead:
# quarkus.rest-client.swapi-api.url=http://localhost:5432/api

# --- Tests -------------------------------------------------------------------
# The whole suite must pass with no network and no model.
#
# The MCP client dials the server when its bean is first created, not when
# Quarkus boots. The MCP health check below is the one thing that would build
# it anyway -- a health check cannot report on a client it has not created. It
# is endpoint-driven, not timed: nothing about it polls on a schedule. With it
# off, nothing connects until a test injects McpClient or the model calls a
# tool. ArchivistWiringTest does inject it, which is a real handshake --
# against a local stub, because McpStubServer overrides the URL for that one
# class (restrictToAnnotatedClass = true). The scoping matters: unrestricted,
# the override reaches every test class and retargets the live
# McpConnectivityTest gate at the stub. For the same reason there is
# deliberately no %test.quarkus.langchain4j.mcp.swapi.url here, and the gate
# hard-fails on a localhost URL by design.
%test.quarkus.langchain4j.mcp.health.enabled=false

# Booting Quarkus for a test must not start an Ollama container or pull a model:
# the tests here never call the model, and on a machine with no Ollama the dev
# service would reach for the container runtime and the network. Test profile
# only, so `quarkus dev` keeps its zero-setup Ollama.
%test.quarkus.langchain4j.devservices.enabled=false
%test.quarkus.langchain4j.devservices.preload=false
